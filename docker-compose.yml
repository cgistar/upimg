services:
  upimg:
    build:
      context: .
      dockerfile: Dockerfile
    image: upimg:dist
    container_name: upimg
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-17788}:${PORT:-17788}'
    environment:
      DATA: '/data'
      FILEPATH: '${FILEPATH:-/data/files}'
      PORT: '${PORT:-17788}'
      # 如需覆盖 config.json 中的 key，可取消注释：
      # KEY: '${KEY:-secret}'
    volumes:
      - '${DATA_DIR:-./data}:/data'
      - '${FILES_DIR:-/home/upimg}:/data/files'
